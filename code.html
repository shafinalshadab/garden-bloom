<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Bloom - Grow Your Flowers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 50%, #a29bfe 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5em;
            color: #2d3436;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #636e72;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: 600;
            min-width: 150px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-card.petals {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.3);
        }

        .stat-card.level {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .garden {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            min-height: 400px;
            background: linear-gradient(135deg, #f0f9ff 0%, #fffbf0 100%);
            padding: 30px;
            border-radius: 20px;
            border: 2px dashed #dfe6e9;
        }

        .flower-plot {
            background: white;
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            position: relative;
            overflow: hidden;
        }

        .flower-plot:hover {
            transform: translateY(-5px);
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
        }

        .flower-plot.active {
            background: linear-gradient(135deg, #f5f7ff 0%, #fff5f7 100%);
            border-color: #667eea;
        }

        .flower-icon {
            font-size: 4em;
            margin-bottom: 10px;
            animation: bloom 0.6s ease-out;
        }

        @keyframes bloom {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .flower-name {
            font-weight: 600;
            color: #2d3436;
            margin-bottom: 5px;
            font-size: 1em;
        }

        .flower-progress {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 10px;
        }

        .flower-progress-bar {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .empty-plot {
            color: #bdc3c7;
            font-size: 0.9em;
            text-align: center;
            opacity: 0.6;
        }

        .empty-plot-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 15px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #f5f7ff;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #f0f9ff;
            border-radius: 15px;
            color: #667eea;
            font-weight: 600;
            border-left: 4px solid #667eea;
            display: none;
        }

        .message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #95a5a6;
            font-size: 0.9em;
            padding-top: 20px;
            border-top: 1px solid #ecf0f1;
        }

        .achievement {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: popIn 0.5s ease-out, popOut 0.5s ease-out 2.5s forwards;
            z-index: 1000;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes popOut {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        .achievement-text {
            font-weight: 700;
            color: #2d3436;
            margin-bottom: 5px;
        }

        .achievement-subtext {
            color: #636e72;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .title {
                font-size: 1.8em;
            }

            .garden {
                grid-template-columns: 1fr 1fr;
            }

            .stats {
                gap: 10px;
            }

            .stat-card {
                min-width: 120px;
                padding: 12px 20px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">🌸 Garden Bloom</div>
            <div class="subtitle">Click to grow beautiful flowers!</div>
        </div>

        <div class="stats">
            <div class="stat-card">Clicks: <span id="clickCount">0</span></div>
            <div class="stat-card petals">Petals: <span id="petalCount">0</span></div>
            <div class="stat-card level">Level: <span id="levelCount">1</span></div>
        </div>

        <div class="garden" id="garden"></div>

        <div class="controls">
            <button class="btn btn-primary" onclick="game.plantFlower()">Plant New Flower</button>
            <button class="btn btn-secondary" onclick="game.reset()">New Garden</button>
        </div>

        <div class="message" id="message"></div>

        <div class="footer">Created by Shafin</div>
    </div>

    <script>
        const flowerTypes = [
            { name: 'Rose', emoji: '🌹', clicksNeeded: 5 },
            { name: 'Tulip', emoji: '🌷', clicksNeeded: 4 },
            { name: 'Sunflower', emoji: '🌻', clicksNeeded: 6 },
            { name: 'Cherry', emoji: '🌸', clicksNeeded: 4 },
            { name: 'Hibiscus', emoji: '🌺', clicksNeeded: 5 },
            { name: 'Daisy', emoji: '🼼', clicksNeeded: 3 },
            { name: 'Lotus', emoji: '🪷', clicksNeeded: 7 },
            { name: 'Orchid', emoji: '🦋', clicksNeeded: 8 }
        ];

        class GardenGame {
            constructor() {
                this.flowers = [];
                this.stats = {
                    clicks: 0,
                    petals: 0,
                    level: 1
                };
                this.load();
                this.render();
            }

            plantFlower() {
                if (this.flowers.length >= 6) {
                    this.showMessage('Your garden is full! Remove flowers to plant more.');
                    return;
                }

                const flowerType = flowerTypes[Math.floor(Math.random() * flowerTypes.length)];
                this.flowers.push({
                    id: Date.now(),
                    type: flowerType,
                    progress: 0,
                    isGrowing: false
                });

                this.save();
                this.render();
                this.showMessage(`🌱 Planted a ${flowerType.name}! Click it to grow.`);
            }

            clickFlower(id) {
                const flower = this.flowers.find(f => f.id === id);
                if (!flower) return;

                this.stats.clicks++;

                if (!flower.isGrowing) {
                    flower.isGrowing = true;
                }

                flower.progress++;
                const needed = flower.type.clicksNeeded;

                if (flower.progress >= needed) {
                    this.bloomFlower(flower);
                } else {
                    this.createParticle(event);
                }

                this.save();
                this.render();
            }

            bloomFlower(flower) {
                const petalCount = Math.floor(Math.random() * 5) + 3;
                this.stats.petals += petalCount;

                if (this.stats.petals >= this.stats.level * 20) {
                    this.stats.level++;
                    this.showAchievement('Level Up!', `You reached level ${this.stats.level}!`);
                }

                this.showAchievement('Bloomed!', `${flower.type.name} gained ${petalCount} petals!`);
                flower.progress = 0;
            }

            removeFlower(id) {
                this.flowers = this.flowers.filter(f => f.id !== id);
                this.save();
                this.render();
            }

            reset() {
                if (confirm('Are you sure? This will clear your entire garden.')) {
                    this.flowers = [];
                    this.stats = { clicks: 0, petals: 0, level: 1 };
                    this.save();
                    this.render();
                    this.showMessage('🌱 Your garden has been cleared. Start fresh!');
                }
            }

            save() {
                localStorage.setItem('gardenGame', JSON.stringify({
                    flowers: this.flowers,
                    stats: this.stats
                }));
            }

            load() {
                const saved = localStorage.getItem('gardenGame');
                if (saved) {
                    const data = JSON.parse(saved);
                    this.flowers = data.flowers;
                    this.stats = data.stats;
                }
            }

            showMessage(text) {
                const msgEl = document.getElementById('message');
                msgEl.textContent = text;
                msgEl.classList.add('show');
                setTimeout(() => msgEl.classList.remove('show'), 3000);
            }

            showAchievement(title, text) {
                const achievement = document.createElement('div');
                achievement.className = 'achievement';
                achievement.innerHTML = `<div class="achievement-text">${title}</div><div class="achievement-subtext">${text}</div>`;
                document.body.appendChild(achievement);
                setTimeout(() => achievement.remove(), 3000);
            }

            createParticle(event) {
                if (!event) return;
                const x = event.clientX;
                const y = event.clientY;
                const particle = document.createElement('div');
                particle.style.position = 'fixed';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.fontSize = '2em';
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '999';
                particle.textContent = '✨';
                document.body.appendChild(particle);

                let opacity = 1;
                const interval = setInterval(() => {
                    opacity -= 0.05;
                    particle.style.opacity = opacity;
                    particle.style.transform = `translateY(${-20 * (1 - opacity)}px)`;
                    if (opacity <= 0) {
                        clearInterval(interval);
                        particle.remove();
                    }
                }, 50);
            }

            render() {
                this.updateStats();
                const garden = document.getElementById('garden');
                garden.innerHTML = '';

                if (this.flowers.length === 0) {
                    garden.innerHTML = `<div class="empty-plot" style="grid-column: 1/-1; text-align: center; padding: 40px;">
                        <div class="empty-plot-icon">🌾</div>
                        <div>Your garden is empty. Plant flowers to get started!</div>
                    </div>`;
                    return;
                }

                this.flowers.forEach(flower => {
                    const progress = Math.min(100, (flower.progress / flower.type.clicksNeeded) * 100);
                    const flowerDiv = document.createElement('div');
                    flowerDiv.className = `flower-plot ${flower.isGrowing ? 'active' : ''}`;
                    flowerDiv.innerHTML = `
                        <div class="flower-icon" onclick="game.clickFlower(${flower.id}); event.stopPropagation();">${flower.type.emoji}</div>
                        <div class="flower-name">${flower.type.name}</div>
                        <div class="flower-progress">
                            <div class="flower-progress-bar" style="width: ${progress}%"></div>
                        </div>
                        <button class="btn btn-secondary" style="margin-top: 10px; padding: 8px 12px; font-size: 0.8em;" onclick="game.removeFlower(${flower.id}); event.stopPropagation();">Remove</button>
                    `;
                    garden.appendChild(flowerDiv);
                });
            }

            updateStats() {
                document.getElementById('clickCount').textContent = this.stats.clicks;
                document.getElementById('petalCount').textContent = this.stats.petals;
                document.getElementById('levelCount').textContent = this.stats.level;
            }
        }

        const game = new GardenGame();
    </script>
</body>
</html>
